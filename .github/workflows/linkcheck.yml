name: linkcheck
on:
  push:
    paths: ['linkcheck/urls.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read u; do
            [ -z "$u" ] && continue
            r=$(curl -sSL -k -A "Mozilla/5.0" -o /tmp/b --max-time 25 -w "%{http_code} %{url_effective}" "$u" 2>&1 | tail -1)
            t=$(grep -oiP '(?<=<title>)[^<]{0,70}' /tmp/b | head -1 | tr -d '\r\n\t')
            echo "RES|$u|$r|$t"
          done < linkcheck/urls.txt
