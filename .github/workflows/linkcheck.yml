name: linkcheck
on:
  push:
    paths: ['linkcheck/urls.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read u; do
            [ -z "$u" ] && continue
            rm -f /tmp/b
            r=$(curl -sSL -k -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120" -o /tmp/b --max-time 25 -w "%{http_code} %{url_effective}" "$u" 2>&1 | tail -1)
            t=$(grep -oiP '(?<=<title>)[^<]{0,70}' /tmp/b 2>/dev/null | head -1 | tr -d '\r\n\t')
            x=$(sed 's/<[^>]*>/ /g' /tmp/b 2>/dev/null | tr -s ' \n\t' ' ' | grep -oP '[가-힣A-Za-z][^{};]{20,140}' | head -2 | tr '\n' ' ')
            echo "RES|$u|$r|$t|$x"
          done < linkcheck/urls.txt
