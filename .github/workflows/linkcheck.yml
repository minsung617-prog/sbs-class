name: linkcheck
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read u; do
            [ -z "$u" ] && continue
            r=$(curl -sSL -k -A "Mozilla/5.0" -o /tmp/b --max-time 25 -w "%{http_code} %{url_effective}" "$u" 2>&1 | tail -1)
            t=$(grep -oiP '(?<=<title>)[^<]{0,80}' /tmp/b | head -1)
            echo "RES|$u|$r|$t"
          done < linkcheck/urls.txt
          curl -sSL -A "Mozilla/5.0" --max-time 20 http://t-fp.kr/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | head -c 600 | sed 's/^/TFP|/'; echo
